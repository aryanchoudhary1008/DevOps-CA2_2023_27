---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - docker.io
      - python3
      - python3-pip
      - git
      - curl
    state: present
    update_cache: true

- name: Ensure docker service is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    shell: /bin/bash
    groups: docker
    append: true
    create_home: true

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Write environment file
  ansible.builtin.copy:
    dest: "{{ app_dir }}/app.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0640"
    content: |
      APP_VERSION=1.0.0
      PORT=5000
